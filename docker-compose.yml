version: '3.8'

services:
  postgres-1:
    image: timescale/timescaledb:2.17.2-pg15
    container_name: postgres-1
    networks:
      - postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=postgresdb
      - PGDATA=/data
    volumes:
      - ./postgres-1/pgdata:/data
      - ./postgres-1/config:/config
      - ./postgres-1/archive:/mnt/server/archive
      - ./postgres-1/initdb:/docker-entrypoint-initdb.d
    ports:
      - "5005:5432"
    command: -c 'config_file=/config/postgresql.conf'

  postgres-2:
    image: timescale/timescaledb:2.17.2-pg15
    container_name: postgres-2
    networks:
      - postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123
      - POSTGRES_DB=postgresdb
      - PGDATA=/data
    volumes:
      - ./postgres-2/pgdata:/data
      - ./postgres-2/config:/config
      - ./postgres-2/archive:/mnt/server/archive
    ports:
      - "5006:5432"
    command: -c 'config_file=/config/postgresql.conf'

networks:
  postgres:
    name: postgres
